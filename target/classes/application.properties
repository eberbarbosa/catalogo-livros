spring.application.name=catalogo-livros

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${CATALOGO_LIVRO_DB_NAME}
spring.datasource.username=${CATALOGO_LIVRO_DB_USER}
spring.datasource.password=${CATALOGO_LIVRO_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.format-sql=true

spring.flyway.enabled=false

